<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidani Holding — Family Office</title>
  <meta name="description" content="A family office style holding company focused on long-term capital preservation and compounding." />
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1620;
      --text:#e9eef6;
      --muted:#a8b3c7;
      --line:rgba(255,255,255,.10);
      --accent:#d6b15e;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --radius:18px;
      --max:1120px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font);
      background:
        radial-gradient(1200px 700px at 70% -10%, rgba(214,177,94,.18), transparent 60%),
        radial-gradient(900px 500px at 10% 10%, rgba(130,170,255,.12), transparent 60%),
        var(--bg);
      color:var(--text);
      line-height:1.5;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding:24px}
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      gap:16px;
      padding:14px 16px;
      border:1px solid var(--line);
      background:rgba(15,22,32,.65);
      backdrop-filter: blur(10px);
      border-radius:999px;
      position:sticky; top:16px; z-index:20;
      box-shadow: var(--shadow);
    }
    .brand{display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:.3px}
    .mark{
      width:32px; height:32px; border-radius:10px;
      background: linear-gradient(135deg, rgba(214,177,94,.95), rgba(255,255,255,.08));
      display:grid; place-items:center;
      color:#0b0f14; font-weight:900;
    }
    .navlinks{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
    .navlinks a{color:var(--muted); font-size:14px}
    .navlinks a:hover{color:var(--text)}
    .cta{
      padding:10px 14px;
      border-radius:999px;
      background: linear-gradient(135deg, rgba(214,177,94,1), rgba(214,177,94,.55));
      color:#0b0f14;
      font-weight:700;
      border:1px solid rgba(255,255,255,.08);
      box-shadow: 0 14px 30px rgba(214,177,94,.16);
      font-size:14px;
      white-space:nowrap;
    }
    .cta:hover{filter:brightness(1.05)}
    .hero{
      padding:56px 0 28px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:28px;
      align-items:stretch;
    }
    @media (max-width: 920px){
      .hero{grid-template-columns:1fr; padding-top:36px}
      .nav{border-radius:18px}
    }
    .kicker{color:var(--accent); font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:12px}
    h1{
      margin:.35rem 0 1rem;
      font-size: clamp(32px, 4.2vw, 52px);
      line-height:1.05;
      letter-spacing:-.02em;
    }
    .lead{color:var(--muted); font-size:16px; max-width:58ch}
    .heroActions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap}
    .btn{
      padding:12px 16px; border-radius:999px;
      border:1px solid var(--line);
      background: rgba(15,22,32,.5);
      color:var(--text);
      font-weight:650;
      font-size:14px;
    }
    .btn:hover{border-color:rgba(214,177,94,.45)}
    .btnPrimary{
      background: linear-gradient(135deg, rgba(214,177,94,1), rgba(214,177,94,.55));
      color:#0b0f14;
      border-color: rgba(255,255,255,.10);
    }
    .panel{
      border:1px solid var(--line);
      background: rgba(15,22,32,.65);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .heroCard{
      padding:18px;
      display:flex; flex-direction:column; justify-content:space-between;
      gap:16px;
    }
    .metricGrid{
      display:grid; grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .metric{
      padding:14px;
      border:1px solid var(--line);
      border-radius:16px;
      background: rgba(11,15,20,.35);
    }
    .metric .label{color:var(--muted); font-size:12px}
    .metric .value{font-size:18px; font-weight:750; margin-top:6px}
    .note{
      color:var(--muted);
      font-size:12px;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
    section{padding:26px 0}
    .sectionHead{display:flex; justify-content:space-between; gap:16px; align-items:flex-end; flex-wrap:wrap}
    .sectionHead h2{margin:0; font-size:22px; letter-spacing:-.01em}
    .sectionHead p{margin:0; color:var(--muted); max-width:70ch}
    .grid3{
      margin-top:16px;
      display:grid; grid-template-columns: repeat(3, 1fr);
      gap:14px;
    }
    @media (max-width: 920px){ .grid3{grid-template-columns:1fr} }
    .card{padding:18px}
    .card h3{margin:0 0 8px; font-size:16px}
    .card p{margin:0; color:var(--muted); font-size:14px}
    .pillars{
      margin-top:16px;
      display:grid; grid-template-columns: 1fr 1fr;
      gap:14px;
    }
    @media (max-width: 920px){ .pillars{grid-template-columns:1fr} }
    .list{
      margin:10px 0 0;
      padding:0 0 0 18px;
      color:var(--muted);
      font-size:14px;
    }
    .divider{height:1px; background:var(--line); margin:24px 0}
    .footer{
      padding:26px 0 42px;
      color:var(--muted);
      font-size:13px;
    }
    .form{
      margin-top:16px;
      display:grid; grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 920px){ .form{grid-template-columns:1fr} }
    input, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(11,15,20,.35);
      color:var(--text);
      outline:none;
      font-family:var(--font);
    }
    input:focus, textarea:focus{border-color: rgba(214,177,94,.6)}
    textarea{min-height:110px; resize:vertical; grid-column:1/-1}
    .formActions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .small{font-size:12px; color:var(--muted)}
